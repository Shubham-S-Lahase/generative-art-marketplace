<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenArt Pro - Generative Art Marketplace</title>
    <meta name="description" content="Create, share, and trade generative artworks in the world's most advanced algorithmic art marketplace" />

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Progressive Web App -->
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="GenArt Pro">

    <!-- Open Graph -->
    <meta property="og:title" content="GenArt Pro - Generative Art Marketplace">
    <meta property="og:description" content="Create, share, and trade generative artworks">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://genartpro.com">
    <meta property="og:image" content="/og-image.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="GenArt Pro - Generative Art Marketplace">
    <meta name="twitter:description" content="Create, share, and trade generative artworks">
    <meta name="twitter:image" content="/twitter-image.png">
  </head>
  <body class="bg-gray-50 dark:bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>

    <!-- Loading Screen -->
    <style>
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }

      .loader-content {
        text-align: center;
        color: white;
      }

      .loader-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .fade-out {
        opacity: 0;
        pointer-events: none;
      }
    </style>

    <div id="initial-loader">
      <div class="loader-content">
        <div class="loader-spinner"></div>
        <h2 style="font-family: 'Inter', sans-serif; font-weight: 600; margin: 0;">GenArt Pro</h2>
        <p style="font-family: 'Inter', sans-serif; margin: 10px 0 0 0; opacity: 0.8;">Loading creative tools...</p>
      </div>
    </div>

    <script>
      // Hide loader when page loads
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('initial-loader');
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(() => loader.remove(), 300);
          }
        }, 500);
      });
    </script>
  </body>
</html>
